name: Repository 自動驗證

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: 驗證知識庫完整性
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: 執行工程計算工具測試
        run: python -m unittest discover -s tests/engineering_calc -p "test_*.py"

      - name: 執行跨 AI 啟動轉接測試
        run: python -m unittest discover -s tests/ai_routing -p "test_*.py"

      - name: 檢查跨 AI 啟動轉接
        run: python scripts/check_cross_agent_adapters.py

      - name: 檢查 AI 頁面路由 manifest
        run: python scripts/build_knowledge_manifests.py --check

      - name: 檢查 AI 快速路由退化
        run: python scripts/check_ai_fastpath.py

      - name: 執行 repository 驗證
        run: python scripts/validate_repo.py
