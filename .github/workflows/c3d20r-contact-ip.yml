name: C3D20R n16 n24 contact integration CSTR (NOT DESIGN)
on:
  pull_request:
    paths:
      - .github/workflows/c3d20r-contact-ip.yml
      - tests/fea_benchmark/envelope_panels/contact_ip_trial.py
      - tests/fea_benchmark/envelope_panels/test_contact_ip_trial.py
permissions:
  contents: read
jobs:
  contact_ip:
    if: github.event.pull_request.number == 135
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prove bounded output-only mutation and negatives
        run: python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p 'test_contact_ip_trial.py' -v
      - name: Get pinned CCX 2.21 and build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c3d20r-ip"
          cd "$RUNNER_TEMP/c3d20r-ip"
          curl --fail --location --silent --show-error --retry 2 --max-time 120 -o calculix-ccx_2.21.orig.tar.bz2 https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21.orig.tar.bz2
          curl --fail --location --silent --show-error --retry 2 --max-time 120 -o calculix-ccx_2.21-1.debian.tar.xz https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21-1.debian.tar.xz
          echo '51d229aee320cf685216d360f7c04f9a57af0148fbe840483a964c86c315da82  calculix-ccx_2.21.orig.tar.bz2' | sha256sum --check
          echo '6c2a934b66491c9e916cbf6328167d417f7e985b380e200facf92c3e953d255f  calculix-ccx_2.21-1.debian.tar.xz' | sha256sum --check
          tar -xjf calculix-ccx_2.21.orig.tar.bz2
          cd CalculiX
          tar -xJf ../calculix-ccx_2.21-1.debian.tar.xz
          while IFS= read -r patchname; do
            test -z "$patchname" && continue
            patch --batch --fuzz=0 -p1 < "debian/patches/$patchname" > /dev/null
          done < debian/patches/series
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gfortran libspooles-dev libarpack2-dev liblapack-dev
          make -s -j2 -C ccx_2.21/src CFLAGS='-O2 -Wall -I/usr/include/spooles -DARCH=Linux -DSPOOLES -DARPACK -DMATRIXSTORAGE -DUSE_MT=1' FFLAGS='-O2 -fallow-argument-mismatch' > "$RUNNER_TEMP/c3d20r-ip/ccx-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/c3d20r-ip/ccx-build.log"; exit 1; }
          cp ccx_2.21/src/ccx_2.21 "$RUNNER_TEMP/c3d20r-ip/ccx"
      - name: Solve n16 and n24 contact integration output
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=1 CCX_NPROC_EQUATION=1 CCX_NPROC_RESULTS=1 CCX_NPROC_STIFFNESS=1
          root="$RUNNER_TEMP/c3d20r-ip"
          for n in 16 24; do
            case_dir="$root/ip${n}_toward"
            python -B tests/fea_benchmark/envelope_panels/contact_ip_trial.py "$n" toward "$case_dir"
            (cd "$case_dir"; timeout 270s "$root/ccx" -i panel > solver.log 2>&1) || { tail -n 90 "$case_dir/solver.log"; exit 1; }
            test -s "$case_dir/panel.dat"
            test -s "$case_dir/panel.sta"
            test -s "$case_dir/panel.frd"
            grep -q 'total surface force' "$case_dir/panel.dat"
            echo "C3D20R_IP_OUTPUT_PRESENT n=$n"
          done
      - name: Preserve full IP output for evidence-based interpretation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3d20r-n16-n24-contact-ip-raw-not-design
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/c3d20r-ip/ip*/panel.inp
            ${{ runner.temp }}/c3d20r-ip/ip*/panel.sta
            ${{ runner.temp }}/c3d20r-ip/ip*/panel.dat
            ${{ runner.temp }}/c3d20r-ip/ip*/panel.frd
            ${{ runner.temp }}/c3d20r-ip/ip*/solver.log
