name: 非線性 FEA 實際執行探針

on:
  pull_request:
    paths:
      - 'tests/fea_benchmark/**'
      - '.github/workflows/calculix-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculix_probe:
    name: CalculiX NLGEOM 實際基準
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 安裝官方套件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends calculix-ccx calculix-cgx xvfb xauth
          command -v ccx
          ccx -v || true
      - name: 記錄 CalculiX 安裝版本與可追溯資訊
        run: |
          set -euo pipefail
          mkdir -p tests/fea_benchmark/provenance
          {
            echo '## Installed package'
            dpkg-query -W calculix-ccx
            echo '## Package source and candidate metadata'
            apt-cache show calculix-ccx | grep -E '^(Package|Version|Source|Filename|SHA256):' | head -n 25
            echo '## Executable'
            command -v ccx
            readlink -f "$(command -v ccx)"
            sha256sum "$(readlink -f "$(command -v ccx)")"
            echo '## OS'
            cat /etc/os-release
          } | tee tests/fea_benchmark/provenance/calculix-package.txt
          # Check presence and format; do not assume a distro version remains fixed.
          grep -Eq '^calculix-ccx[[:space:]]+[0-9]' tests/fea_benchmark/provenance/calculix-package.txt
          grep -Eq '^[0-9a-f]{64}[[:space:]]+/usr/bin/ccx$' tests/fea_benchmark/provenance/calculix-package.txt
          grep -q '^VERSION_ID="24.04"$' tests/fea_benchmark/provenance/calculix-package.txt
      - name: 實際解非線性 truss benchmark
        working-directory: tests/fea_benchmark
        run: |
          timeout 90s ccx -i geometric_truss
          python check_truss.py
      - name: 以 CGX 重建公開非線性殼板模型
        working-directory: tests/fea_benchmark/shell90
        run: |
          timeout 60s xvfb-run -a cgx -b mesh.fbd
          test -s all.msh
          test -s fix.nam
          test -s rot.nam
          test -s fix.sur
          test -s rot.sur
          grep -qi 'S8' all.msh
      - name: 真實執行 90 度 NLGEOM 殼板
        working-directory: tests/fea_benchmark/shell90
        run: |
          timeout 90s ccx -i shell90
          test -s shell90.sta
          test -s shell90.frd
          tail -n 35 shell90.sta
          python check_shell90.py
      - name: 三層網格非線性殼板收斂與獨立圓弧比較
        working-directory: tests/fea_benchmark/shell90
        run: |
          set -euo pipefail
          for count in 20 40 80; do
            mkdir -p "mesh_${count}"
            sed "s/swep all rot tra 100 0 0 40/swep all rot tra 100 0 0 ${count}/" mesh.fbd > "mesh_${count}/mesh.fbd"
            cp shell90.inp "mesh_${count}/shell90.inp"
            (cd "mesh_${count}" && timeout 60s xvfb-run -a cgx -b mesh.fbd && timeout 90s ccx -i shell90)
          done
          python check_mesh_convergence.py
          python diagnose_end_reactions.py
      - name: 面外均佈壓力薄板解析與幾何非線性檢核
        working-directory: tests/fea_benchmark/pressure_plate
        run: |
          set -euo pipefail
          for case in small large; do
            for n in 4 8 16; do
              python generate.py --n "${n}" --case "${case}" --output "${case}_${n}"
              (cd "${case}_${n}" && timeout 90s ccx -i plate)
            done
          done
          python check.py
      - name: 玻璃與鋁板合成面外風壓驗證
        working-directory: tests/fea_benchmark/envelope_panels
        run: |
          set -euo pipefail
          for material in glass aluminum; do
            for load in small large; do
              for n in 4 8 16; do
                python generate.py --material "$material" --load "$load" --n "$n" --output "${material}_${load}_${n}"
                (cd "${material}_${load}_${n}" && timeout 90s ccx -i panel)
              done
            done
          done
          python check.py
          python check_reactions.py
          python -m unittest -v test_pressure_equilibrium.py
          python check_pressure_equilibrium.py
          # Stage 56: independent ideal simply-supported aluminum boundary,
          # reuse the existing clamped aluminum_small_4/8/16 solver cases.
          python -m unittest -v test_simple_supported_aluminum.py
          for n in 4 8 16; do
            folder="aluminum_simple_small_${n}"
            python check_simple_supported_aluminum.py --generate "$folder" "$n"
            (cd "$folder" && timeout 90s ccx -i panel)
          done
          python check_simple_supported_aluminum.py .
          # Stage 57: synthetic connected U-fold shell, end-line load, true CCX.
          python -m unittest -v test_u_fold_cantilever.py
          for n in 8 16; do
            python check_u_fold_cantilever.py --generate "u_fold_${n}" "$n"
            (cd "u_fold_${n}" && timeout 90s ccx -i panel)
          done
          python check_u_fold_cantilever.py .
          # Stage 58: fixed U-fold web-only synthetic shell pressure.
          python -m unittest -v test_u_fold_web_pressure.py
          for n in 8 16; do
            python check_u_fold_web_pressure.py --generate "u_fold_pressure_${n}" "$n"
            (cd "u_fold_pressure_${n}" && timeout 90s ccx -i panel)
          done
          python check_u_fold_web_pressure.py .
          # Stage 59: four-edge clamped synthetic plate; centered continuous rib.
          python -m unittest -v test_center_rib_plate.py
          for n in 8 16; do
            for rib in 0 4 8; do
              label="center_rib_h${rib}_n${n}"
              python check_center_rib_plate.py --generate "$label" "$n" "$rib"
              (cd "$label" && timeout 90s ccx -i panel)
            done
          done
          python check_center_rib_plate.py .
          # Bounded 2/3-mm plate + rib thickness sweep; reuse same-run Stage 59 control.
          python -m unittest -v test_rib_thickness_sweep.py
          for n in 8 16; do
            for rib in 0 4 8; do
              folder="rib_thickness_3_h${rib}_n${n}"
              python check_rib_thickness_sweep.py --generate "$folder" "$n" "$rib" 3.0
              (cd "$folder" && timeout 90s ccx -i panel)
            done
          done
          python check_rib_thickness_sweep.py .
          # Engineering-facing, research-only comparison using same-run verified 12 cases.
          python -m unittest -v test_rib_thickness_engineering_report.py
          python check_rib_thickness_sweep.py . | head -n 1 > "$RUNNER_TEMP/rib_thickness_verified.json"
          python rib_thickness_engineering_report.py "$RUNNER_TEMP/rib_thickness_verified.json" > "$RUNNER_TEMP/rib_thickness_comparison.md"
          grep -q "MATERIAL_CAPACITY_NOT_ADMITTED" "$RUNNER_TEMP/rib_thickness_comparison.md"
          # Stage 60: extra ideal constraints on synthetic centered-rib ends.
          python -m unittest -v test_rib_end_transfer.py
          for n in 8 16; do
            for support in rib_end_free rib_end_fixed; do
              folder="rib_end_${support}_n${n}"
              python check_rib_end_transfer.py --generate "$folder" "$n" "$support"
              (cd "$folder" && timeout 90s ccx -i panel)
            done
          done
          python check_rib_end_transfer.py .
          # Stage 61: bound finite DOF3 rib-end springs, reuse same-run Stage 60 free cases.
          python -m unittest -v test_rib_end_spring.py
          for n in 8 16; do
            for k in 1000 10000; do
              folder="rib_spring_k${k}_n${n}"
              python check_rib_end_spring.py --generate "$folder" "$n" "$k"
              (cd "$folder" && timeout 90s ccx -i panel)
            done
          done
          python check_rib_end_spring.py .
          # Stage 62: translation-only SPRING1 directional counterfactuals (DOF1/2);
          # reuse same-commit Stage 60 free and Stage 61 DOF3 results.
          python -m unittest -v test_rib_end_direction.py
          for n in 8 16; do
            for dof in 1 2; do
              label="rib_direction_dof${dof}_n${n}"
              python check_rib_end_direction.py --generate "$label" "$n" "$dof"
              (cd "$label" && timeout 90s ccx -i panel)
            done
          done
          python check_rib_end_direction.py .
          # Stage 65: paired rib-end X-spring height windows, synthetic only.
          python -m unittest -v test_rib_spring_height.py
          for n in 8 16; do
            for window in low high; do
              folder="rib_height_${window}_n${n}"
              python check_rib_spring_height.py --generate "$folder" "$n" "$window"
              (cd "$folder" && timeout 90s ccx -i panel)
            done
          done
          python check_rib_spring_height.py .
          # Stage 66: same-run Stage 65 solver output, per-rib-end derived k*u.
          python -m unittest -v test_rib_local_groups.py
          python check_rib_local_groups.py .
          # Stage 67: bounded per-height spring force envelope and 8/16 mesh screen.
          python -m unittest -v test_rib_force_peak_distribution.py
          python check_rib_force_peak_distribution.py .
          # Stage 68: synthetic clean-SPC and directly loaded-SPC RF semantics.
          python -m unittest -v test_spring_rf_observation.py
          for rf_case in clean_spc loaded_spc; do
            folder="rf_observe_${rf_case}"
            python check_spring_rf_observation.py --generate "$folder" "$rf_case"
            (cd "$folder" && timeout 90s ccx -i panel)
          done
          python check_spring_rf_observation.py .
          # Stage 69: isolated two-term *EQUATION versus clean SPC control.
          python -m unittest -v test_mpc_reaction.py
          for mpc_case in control equation; do
            folder="mpc69_${mpc_case}"
            python check_mpc_reaction.py --generate "$folder" "$mpc_case"
            (cd "$folder" && timeout 90s ccx -i panel)
          done
          python check_mpc_reaction.py .
          # Stage 64 finite-EI B31 beam, synthetic root rotation via stiff arms.
          python -m unittest -v test_finite_ei_rotation.py
          for n in 4 8; do
            for mode in clamped root_spring; do
              folder="finite_ei_${mode}_n${n}"
              python check_finite_ei_rotation.py --generate "$folder" "$n" "$mode"
              (cd "$folder" && timeout 90s ccx -i panel)
            done
          done
          python check_finite_ei_rotation.py .
          # Stage 63: isolated rigid lever and SPRING1 translation-only benchmark.
          python -m unittest -v test_rigid_lever_rotation.py
          for case in rotation distribution; do
            folder="rigid_lever_${case}"
            python check_rigid_lever_rotation.py --generate "$folder" "$case"
            (cd "$folder" && timeout 90s ccx -i panel)
          done
          python check_rigid_lever_rotation.py .
          python -m unittest -v test_follower_pressure.py
          python -m unittest -v test_expanded_face.py
          python -m unittest -v test_expanded_frd.py
          python check_expanded_frd.py
          python -m unittest -v test_compare_pressure_surfaces.py
          python compare_pressure_surfaces.py
          python -m unittest -v test_audit_rf_projection.py
          python audit_rf_projection.py
          # Paired runs differ only by NALL RF print selection; do not reuse old output.
          for material in glass aluminum; do
            for n in 4 8 16; do
              source="${material}_large_${n}"
              paired="${material}_large_${n}_no_nall_rf"
              mkdir -p "$paired"
              sed '/^\*NODE PRINT,NSET=NALL$/{n;s/^U,RF$/U/;}' "$source/panel.inp" > "$paired/panel.inp"
              (cd "$paired" && timeout 90s ccx -i panel)
            done
          done
          python -m unittest -v test_output_selection_ab.py
          python check_output_selection_ab.py
          python -m unittest -v test_rf_3d_projection.py
          python check_rf_3d_projection.py
          python -m unittest -v test_reconstructed_pressure_balance.py
          python check_reconstructed_pressure_balance.py
          python -m unittest -v test_expanded_moment_diagnostic.py
          python check_expanded_moment_diagnostic.py
          python -m unittest -v test_required_couple.py
          python check_required_couple.py
          python -m unittest -v test_rotation_spc_ab.py
          for n in 4 8 16; do
            base="aluminum_large_${n}"
            paired="aluminum_large_${n}_no_drilling"
            mkdir -p "$paired"
            sed "s/^EDGE,1,6,0\.$/EDGE,1,5,0./" "$base/panel.inp" > "$paired/panel.inp"
            (cd "$paired" && timeout 90s ccx -i panel)
          done
          python check_rotation_spc_ab.py
          python -m unittest -v test_expanded_moment_partition.py
          python check_expanded_moment_partition.py
          python -m unittest -v test_run_synthetic_panel.py
          python -m unittest -v test_synthetic_replay.py
          python -m unittest -v test_aluminum_research.py
          python -m unittest -v test_prepare_aluminum_material_input.py
          python -m unittest -v test_aluminum_material_evidence.py
          python -m unittest -v test_aluminum_grade_replay.py
          python -m unittest -v test_synthetic_plastic_cube.py
          python -m unittest -v test_validate_private_hardening.py
          # Stage 49: deliberately synthetic one-element material-law oracle
          for case in elastic plastic unload; do
            fixture="$RUNNER_TEMP/synthetic_constitutive_$case"
            mkdir -p "$fixture"
            python synthetic_plastic_cube.py --case "$case" --directory "$fixture"
            (cd "$fixture" && timeout 60s ccx -i cube)
            python synthetic_plastic_cube.py --case "$case" --directory "$fixture" --check
          done
          # Stage 48: all three grades have identical explicit synthetic
          # properties; grade labels alone must not change solver physics.
          for grade in 3003-H14 3004-H12 3004-O; do
            root="$RUNNER_TEMP/grade_replay"
            mkdir -p "$root"
            python -c 'import json,sys; from test_aluminum_grade_replay import choice; print(json.dumps(choice(sys.argv[1])))' "$grade" > "$root/selection_$grade.json"
            python prepare_aluminum_material_input.py --selection "$root/selection_$grade.json" --output "$root/input_$grade.json"
            mkdir -p "$root/run_$grade"
            python run_aluminum_research.py --input "$root/input_$grade.json" --workspace "$root/run_$grade" --ccx "$(command -v ccx)" --execute > "$root/result_$grade.json"
          done
          python check_aluminum_grade_replay.py "$RUNNER_TEMP/grade_replay"
          python -m unittest -v test_aluminum_result_summary.py
          python -m unittest -v test_aluminum_tensor_observation.py
          python -m unittest -v test_aluminum_elastic_scaling.py
          # Stage 43: true independent pressure-scaled S8R runs, same geometry/material.
          for level in baseline doubled; do
            if [ "$level" = baseline ]; then pressure=0.0001; else pressure=0.0002; fi
            fixture="$RUNNER_TEMP/scaling_$level"
            mkdir -p "$fixture/run"
            python -c 'import json,sys; from check_aluminum_ritz import expected_input; c=expected_input("thicker_square",16); c["pressure_n_mm2"]=float(sys.argv[1]); print(json.dumps(c))' "$pressure" > "$fixture/input.json"
            python run_aluminum_research.py --input "$fixture/input.json" --workspace "$fixture/run" --ccx "$(command -v ccx)" --execute > "$fixture/output.json"
          done
          python check_aluminum_elastic_scaling.py "$RUNNER_TEMP/scaling_baseline" "$RUNNER_TEMP/scaling_doubled"
          # Engineering-facing research-only brief: unit gate and actual CCX research JSON.
          python -m unittest -v test_aluminum_engineering_brief.py
          python aluminum_engineering_brief.py "$RUNNER_TEMP/scaling_baseline/output.json" > "$RUNNER_TEMP/aluminum_engineering_brief.md"
          grep -q "NOT_ADMITTED" "$RUNNER_TEMP/aluminum_engineering_brief.md"
          grep -q "不是.*獨立量得" "$RUNNER_TEMP/aluminum_engineering_brief.md"
          python -m unittest -v test_aluminum_normal_hooke.py
          python check_aluminum_normal_hooke.py "$RUNNER_TEMP/scaling_baseline"
          python -m unittest -v test_aluminum_ritz_stress.py
          python check_aluminum_ritz_stress.py "$RUNNER_TEMP/scaling_baseline"
          python -m unittest -v test_aluminum_ritz_mesh_stress.py
          python -m unittest -v test_aluminum_ritz.py
          for case in thicker_square rectangular_higher_pressure; do
            fixture="$RUNNER_TEMP/ritz_${case}"
            mkdir -p "$fixture"
            for n in 4 8 16; do
              python -c 'import json,sys; from check_aluminum_ritz import expected_input; print(json.dumps(expected_input(sys.argv[1],int(sys.argv[2]))))' "$case" "$n" > "$fixture/input_${n}.json"
              mkdir -p "$fixture/mesh_${n}"
              python run_aluminum_research.py --input "$fixture/input_${n}.json" --workspace "$fixture/mesh_${n}" --ccx "$(command -v ccx)" --execute > "$fixture/output_${n}.json"
            done
            python check_aluminum_ritz.py "$fixture" "$case"
            python check_aluminum_ritz_mesh_stress.py "$fixture" "$case"
          done
          mkdir -p "$RUNNER_TEMP/aluminum_research_run"
          cat > "$RUNNER_TEMP/aluminum_research_input.json" <<'EOF'
          {"width_mm":100.0,"height_mm":100.0,"thickness_mm":2.0,"youngs_modulus_mpa":69000.0,"poisson_ratio":0.33,"pressure_n_mm2":0.6,"mesh":4,"support":"four_edges_clamped","units":"N-mm-MPa","material_provenance":"explicit bounded synthetic test values"}
          EOF
          python run_aluminum_research.py --input "$RUNNER_TEMP/aluminum_research_input.json" --workspace "$RUNNER_TEMP/aluminum_research_run" --ccx "$(command -v ccx)" --execute
          mkdir -p "$RUNNER_TEMP/aluminum_variant_run"
          cat > "$RUNNER_TEMP/aluminum_variant_input.json" <<'EOF'
          {"width_mm":120.0,"height_mm":80.0,"thickness_mm":2.5,"youngs_modulus_mpa":70000.0,"poisson_ratio":0.32,"pressure_n_mm2":0.3,"mesh":8,"support":"four_edges_clamped","units":"N-mm-MPa","material_provenance":"explicit alternative synthetic research values"}
          EOF
          python run_aluminum_research.py --input "$RUNNER_TEMP/aluminum_variant_input.json" --workspace "$RUNNER_TEMP/aluminum_variant_run" --ccx "$(command -v ccx)" --execute > "$RUNNER_TEMP/aluminum_variant_result.json"
          python -c 'import json,sys; from pathlib import Path; from check_pressure_equilibrium import parse_deck; from aluminum_research_input import load; model=load(Path(sys.argv[1])); nodes,elements,edge,q=parse_deck(Path(sys.argv[2])); result=json.loads(Path(sys.argv[3]).read_text()); assert result["execution_status"]=="ALUMINUM_PARAMETRIC_RESEARCH_EVIDENCE_PASS"; assert result["engineering_acceptance"]=="NOT_ADMITTED"; assert len(elements)==model["mesh"]**2; assert abs(q-model["pressure_n_mm2"])<1e-12; assert abs(max(p[0] for p in nodes.values())-model["width_mm"])<1e-6; assert abs(max(p[1] for p in nodes.values())-model["height_mm"])<1e-6; print("ALUMINUM_VARIANT_INPUT_GEOMETRY_AND_PRESSURE_PASS")' "$RUNNER_TEMP/aluminum_variant_input.json" "$RUNNER_TEMP/aluminum_variant_run/panel.inp" "$RUNNER_TEMP/aluminum_variant_result.json"
          for material in glass aluminum; do
            for n in 4 8 16; do
              folder="adapter_smoke_${material}_${n}"
              mkdir -p "$folder"
              python run_synthetic_panel.py --material "$material" --mesh "$n" --workspace "$folder" --ccx "$(command -v ccx)" --execute > "$RUNNER_TEMP/adapter_${material}_${n}.json"
              cat "$RUNNER_TEMP/adapter_${material}_${n}.json"
            done
          done
          for material in glass aluminum; do
            folder="adapter_replay_${material}_4"
            mkdir -p "$folder"
            python run_synthetic_panel.py --material "$material" --mesh 4 --workspace "$folder" --ccx "$(command -v ccx)" --execute > "$RUNNER_TEMP/adapter_replay_${material}_4.json"
            python check_synthetic_replay.py "$RUNNER_TEMP/adapter_${material}_4.json" "$RUNNER_TEMP/adapter_replay_${material}_4.json"
          done
          python check_follower_pressure.py
      - name: 保存可查證數值輸出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculix-nlgeom-probe
          path: |
            tests/fea_benchmark/provenance/*.txt
            tests/fea_benchmark/*.dat
            tests/fea_benchmark/*.sta
            tests/fea_benchmark/*.cvg
            tests/fea_benchmark/*.frd
            tests/fea_benchmark/shell90/*.dat
            tests/fea_benchmark/shell90/*.sta
            tests/fea_benchmark/shell90/*.frd
            tests/fea_benchmark/shell90/mesh_*/*.dat
            tests/fea_benchmark/shell90/mesh_*/*.sta
            tests/fea_benchmark/shell90/mesh_*/*.frd
            tests/fea_benchmark/pressure_plate/*/*.dat
            tests/fea_benchmark/pressure_plate/*/*.sta
            tests/fea_benchmark/envelope_panels/*/*.dat
            tests/fea_benchmark/envelope_panels/*/*.frd
            tests/fea_benchmark/envelope_panels/*/*.sta
          if-no-files-found: warn
