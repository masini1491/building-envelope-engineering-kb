name: C3D20R distributed pressure contact pilot (NOT DESIGN)
on:
  pull_request:
    paths:
      - .github/workflows/c3d20r-pressure-contact.yml
      - tests/fea_benchmark/envelope_panels/pressure_contact_trial.py
      - tests/fea_benchmark/envelope_panels/test_pressure_contact_trial.py
      - tests/fea_benchmark/envelope_panels/verify_pressure_contact_trial.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pressure_trial:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 135
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Pressure driver deterministic and negative checks
        run: python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p 'test_pressure_contact_trial.py' -v
      - name: Get pinned CCX 2.21 and build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c3d20r-pressure"
          cd "$RUNNER_TEMP/c3d20r-pressure"
          curl --fail --location --silent --show-error --retry 2 --max-time 120 -o calculix-ccx_2.21.orig.tar.bz2 https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21.orig.tar.bz2
          curl --fail --location --silent --show-error --retry 2 --max-time 120 -o calculix-ccx_2.21-1.debian.tar.xz https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21-1.debian.tar.xz
          echo '51d229aee320cf685216d360f7c04f9a57af0148fbe840483a964c86c315da82  calculix-ccx_2.21.orig.tar.bz2' | sha256sum --check
          echo '6c2a934b66491c9e916cbf6328167d417f7e985b380e200facf92c3e953d255f  calculix-ccx_2.21-1.debian.tar.xz' | sha256sum --check
          tar -xjf calculix-ccx_2.21.orig.tar.bz2
          cd CalculiX
          tar -xJf ../calculix-ccx_2.21-1.debian.tar.xz
          while IFS= read -r patchname; do
            test -z "$patchname" && continue
            patch --batch --fuzz=0 -p1 < "debian/patches/$patchname" > /dev/null
          done < debian/patches/series
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gfortran libspooles-dev libarpack2-dev liblapack-dev
          make -s -j2 -C ccx_2.21/src CFLAGS='-O2 -Wall -I/usr/include/spooles -DARCH=Linux -DSPOOLES -DARPACK -DMATRIXSTORAGE -DUSE_MT=1' FFLAGS='-O2 -fallow-argument-mismatch' > "$RUNNER_TEMP/c3d20r-pressure/ccx-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/c3d20r-pressure/ccx-build.log"; exit 1; }
          cp ccx_2.21/src/ccx_2.21 "$RUNNER_TEMP/c3d20r-pressure/ccx"
      - name: Solve six real quadratic pressure models
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=1 CCX_NPROC_EQUATION=1 CCX_NPROC_RESULTS=1 CCX_NPROC_STIFFNESS=1
          scratch="$RUNNER_TEMP/c3d20r-pressure"
          any_failure=0
          for mesh in 8 16; do
            for scenario in toward unlinked clearance; do
              label="p${mesh}_${scenario}"
              python -B tests/fea_benchmark/envelope_panels/pressure_contact_trial.py --generate "$scratch/$label" "$mesh" "$scenario"
              if (cd "$scratch/$label"; timeout 180s "$scratch/ccx" -i panel > solver.log 2>&1); then
                if test -s "$scratch/$label/panel.sta" && test -s "$scratch/$label/panel.dat" && test -s "$scratch/$label/panel.frd"; then
                  echo "C3D20R_PRESSURE_SOLVER_OUTPUT_PRESENT $label"
                else
                  echo "::error::C3D20R_PRESSURE_OUTPUT_MISSING $label"; any_failure=1
                fi
              else
                echo "::error::C3D20R_PRESSURE_SOLVE_FAILED $label"
                tail -n 80 "$scratch/$label/solver.log"
                any_failure=1
              fi
            done
          done
          if test "$any_failure" != 0; then
            echo "::error::Not all six quadratic pressure models solved"; exit 1
          fi
      - name: Verify bounded pressure support force contact and clearance
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/c3d20r-pressure"
          python -B tests/fea_benchmark/envelope_panels/verify_pressure_contact_trial.py "$scratch" > "$scratch/pressure-report.json"
          cat "$scratch/pressure-report.json"
      - name: Preserve real solver inputs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3d20r-pressure-feasibility-not-design
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/c3d20r-pressure/p*/panel.inp
            ${{ runner.temp }}/c3d20r-pressure/p*/panel.dat
            ${{ runner.temp }}/c3d20r-pressure/p*/panel.sta
            ${{ runner.temp }}/c3d20r-pressure/p*/panel.frd
            ${{ runner.temp }}/c3d20r-pressure/p*/solver.log
            ${{ runner.temp }}/c3d20r-pressure/pressure-report.json
            ${{ runner.temp }}/c3d20r-pressure/ccx-build.log
