name: CalculiX 2.21 支承群能量差分診斷

on:
  pull_request:
    paths:
      - .github/workflows/ccx221-support-energy-fd.yml

permissions:
  contents: read
  actions: read

jobs:
  pinned_support_probe:
    if: github.event.pull_request.number == 131
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: 安裝固定版本建置相依套件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gfortran libspooles-dev libarpack2-dev liblapack-dev
          gfortran --version | head -n 1
      - name: 取得精確來源與既有同次求解輸入
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ccx-ab" "$RUNNER_TEMP/ccx-ab/ref"
          cd "$RUNNER_TEMP/ccx-ab"
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            -o calculix-ccx_2.21.orig.tar.bz2 \
            https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21.orig.tar.bz2
          echo '51d229aee320cf685216d360f7c04f9a57af0148fbe840483a964c86c315da82  calculix-ccx_2.21.orig.tar.bz2' | sha256sum --check
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            -o calculix-ccx_2.21-1.debian.tar.xz \
            https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21-1.debian.tar.xz
          echo '6c2a934b66491c9e916cbf6328167d417f7e985b380e200facf92c3e953d255f  calculix-ccx_2.21-1.debian.tar.xz' | sha256sum --check
          gh run download 39054940762 --repo masini1491/building-envelope-engineering-kb \
            --name calculix-nlgeom-probe --dir "$RUNNER_TEMP/ccx-ab/ref"
          test -f "$RUNNER_TEMP/ccx-ab/ref/envelope_panels/u_s8r_rf_projection_n8_toward/panel.inp"
          echo 'e0360eed38d6708075200c499a870e38e79f120eaa88ff7427c497e7f0cef2cf  '"$RUNNER_TEMP/ccx-ab/ref/envelope_panels/u_s8r_rf_projection_n8_toward/panel.inp" | sha256sum --check
          test -f "$RUNNER_TEMP/ccx-ab/ref/envelope_panels/u_s8r_rf_projection_n16_toward/panel.inp"
          echo '90becf2d6530482a88991f7e038ee63162f52ec41e9943ddfb16be612c7ee6cf  '"$RUNNER_TEMP/ccx-ab/ref/envelope_panels/u_s8r_rf_projection_n16_toward/panel.inp" | sha256sum --check
      - name: 構建未修改的 Debian 2.21-1 求解器
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ccx-ab"
          tar -xjf calculix-ccx_2.21.orig.tar.bz2
          cd CalculiX
          tar -xJf ../calculix-ccx_2.21-1.debian.tar.xz
          while IFS= read -r patchname; do
            test -z "$patchname" && continue
            patch --batch --fuzz=0 -p1 < "debian/patches/$patchname" >/dev/null
          done < debian/patches/series
          src="$PWD/ccx_2.21/src"
          make -s -j2 -C "$src" \
            CFLAGS='-O2 -Wall -I/usr/include/spooles -DARCH=Linux -DSPOOLES -DARPACK -DMATRIXSTORAGE -DUSE_MT=1' \
            FFLAGS='-O2 -fallow-argument-mismatch' > "$RUNNER_TEMP/ccx-ab/pristine-build.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/ccx-ab/pristine-build.log"; exit 1;
            }
          test -x "$src/ccx_2.21"
          cp "$src/ccx_2.21" "$RUNNER_TEMP/ccx-ab/pristine-ccx"
          sha256sum "$RUNNER_TEMP/ccx-ab/pristine-ccx"
      - name: 產生板邊與肋端群組 Z 微擾輸入
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,hashlib,re,json,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ccx-ab'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          expected={8:'e0360eed38d6708075200c499a870e38e79f120eaa88ff7427c497e7f0cef2cf',
                    16:'90becf2d6530482a88991f7e038ee63162f52ec41e9943ddfb16be612c7ee6cf'}
          groups={'plate':'PLATE_EDGE_RF','rib':'RIB_END_RF'}
          trials={'minus2':-0.0002,'minus1':-0.0001,
                  'plus1':0.0001,'plus2':0.0002}
          center='CENTER_RF,3,3,0.02000000\n'
          contact='*CONTACT PRINT,SLAVE=RIB_BASE_UNDERSIDE,MASTER=PLATE_TOP\nCF,CFN,CNUM\n'
          energy='*EL PRINT,ELSET=PLATE,TOTALS=ONLY\nELSE\n*EL PRINT,ELSET=RIB,TOTALS=ONLY\nELSE\n'
          def once(text,old,new):
            if text.count(old)!=1:raise ValueError('UNIQUE_ANCHOR_FAILED:'+old[:38])
            return text.replace(old,new,1)
          def nodes(deck,name):
            m=re.search(r'^\*NSET,NSET='+name+r'\s*\n([^*]+)',deck,re.M)
            if not m:raise ValueError('NSET_MISSING:'+name)
            return set(int(x) for x in re.findall(r'\d+',m.group(1)))
          manifest={'scope':'RESEARCH_ONLY_NOT_ENGINEERING_ADMISSION','cases':{}}
          for n in (8,16):
            path=root/'ref'/'envelope_panels'/f'u_s8r_rf_projection_n{n}_toward'/'panel.inp'
            b=path.read_bytes()
            if sha(b)!=expected[n]:raise ValueError('REFERENCE_INPUT_SHA_MISMATCH')
            original=b.decode('ascii')
            sets={x:nodes(original,y) for x,y in {**groups,'center':'CENTER_RF'}.items()}
            if any(not s for s in sets.values()) or any(sets[x]&sets[y] for x,y in (
                  ('plate','rib'),('plate','center'),('rib','center'))):
              raise ValueError('BOUNDARY_GROUPS_OVERLAP')
            for group in ('base','plate','rib'):
              for label,delta in ([('base',0.)] if group=='base' else trials.items()):
                deck=original
                if group!='base':
                  deck=once(deck,center,center+f'{groups[group]},3,3,{delta:.8f}\n')
                elif deck.count(center)!=1:raise ValueError('CENTER_MISSING')
                deck=once(deck,contact,
                  '*CONTACT PRINT,SLAVE=RIB_BASE_UNDERSIDE,MASTER=PLATE_TOP,TOTALS=YES\n'
                  'CF,CFN,CNUM,CELS\n')
                deck=once(deck,'*END STEP\n',energy+'*END STEP\n')
                key=f'n{n}/'+('base' if group=='base' else f'{group}/{label}')
                folder=root/'support-energy'/key
                folder.mkdir(parents=True,exist_ok=False)
                material=deck.encode('ascii')
                (folder/'panel.inp').write_bytes(material)
                manifest['cases'][key]={'mesh':n,'group':group,'delta_z_mm':delta,
                                       'input_sha256':sha(material)}
          (root/'support-energy'/'manifest.json').write_text(
              json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          assert len(manifest['cases'])==18
          print('KB_SUPPORT_Z_SOURCE_PINNED_18_DECKS_PASS')
          PY
      - name: 求解兩網格支承能量微擾
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/ccx-ab"
          export OMP_NUM_THREADS=1 CCX_NPROC_EQUATION=1 CCX_NPROC_RESULTS=1 CCX_NPROC_STIFFNESS=1
          for mesh in 8 16; do
            for set in base plate rib; do
              if [ "$set" = base ]; then trials="base"; else trials="minus2 minus1 plus1 plus2"; fi
              for trial in $trials; do
                if [ "$set" = base ]; then folder="$scratch/support-energy/n$mesh/base"; else folder="$scratch/support-energy/n$mesh/$set/$trial"; fi
                (
                  cd "$folder"
                  timeout 150s "$scratch/pristine-ccx" -i panel > solver.log 2>&1 || {
                    tail -n 100 solver.log
                    exit 1
                  }
                  test -s panel.dat
                  test -s panel.sta
                  grep -qi 'total internal energy for set PLATE' panel.dat
                  grep -qi 'total internal energy for set RIB' panel.dat
                  grep -qi 'total contact spring energy' panel.dat
                  sha256sum panel.inp panel.dat panel.sta
                  echo "KB_SUPPORT_Z_OBSERVED n$mesh $set $trial"
                )
              done
            done
          done
      - name: 獨立檢查支承自由體力與微擾分支
        run: |
          set -euo pipefail
          python tests/fea_benchmark/envelope_panels/check_ccx221_support_fd.py             "$RUNNER_TEMP/ccx-ab" > "$RUNNER_TEMP/ccx-ab/support-energy/reconciliation.json"
          test -s "$RUNNER_TEMP/ccx-ab/support-energy/reconciliation.json"
          grep -q '"raw_rf3_original_gate": "FAIL_CLOSED"' "$RUNNER_TEMP/ccx-ab/support-energy/reconciliation.json"
      - name: 保留支承能量逐案例原始證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccx221-n8-n16-support-z-fd-research
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ccx-ab/support-energy/manifest.json
            ${{ runner.temp }}/ccx-ab/support-energy/reconciliation.json
            ${{ runner.temp }}/ccx-ab/support-energy/**/panel.inp
            ${{ runner.temp }}/ccx-ab/support-energy/**/panel.dat
            ${{ runner.temp }}/ccx-ab/support-energy/**/panel.sta
            ${{ runner.temp }}/ccx-ab/support-energy/**/solver.log
            ${{ runner.temp }}/ccx-ab/pristine-build.log
