name: C3D20R synthetic stud strength-demand research bridge (NOT DESIGN)
on:
  pull_request:
    paths:
      - .github/workflows/c3d20r-stud-strength-demand-bridge.yml
      - tests/fea_benchmark/envelope_panels/stud_strength_demand_bridge.py
      - tests/fea_benchmark/envelope_panels/test_stud_strength_demand_bridge.py
      - tests/fea_benchmark/envelope_panels/stud_tensile_strength_screen.py
permissions:
  contents: read
  actions: read
jobs:
  synthetic_bridge:
    if: github.event.pull_request.number == 135
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Source-free negative and admission-boundary tests
        run: python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p test_stud_strength_demand_bridge.py -v
      - name: Download exact earlier verified synthetic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stud-bridge"
          gh api /repos/masini1491/building-envelope-engineering-kb/actions/artifacts/12343751844/zip > "$RUNNER_TEMP/stud-bridge/position-report.zip"
          echo '8207996dc19ab5674c1bc0b218d5048c13fbe4fe8e9f087b1ce06884a38326d1  '"$RUNNER_TEMP/stud-bridge/position-report.zip" | sha256sum --check
      - name: CLI compare strictly synthetic specimen to pinned research forces
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tests/fea_benchmark/envelope_panels')
          from test_stud_strength_demand_bridge import dummy_tensile
          Path(os.environ['RUNNER_TEMP'], 'stud-bridge', 'synthetic-strength.json').write_text(json.dumps(dummy_tensile()))
          PY
          python -B tests/fea_benchmark/envelope_panels/stud_strength_demand_bridge.py "$RUNNER_TEMP/stud-bridge/synthetic-strength.json" "$RUNNER_TEMP/stud-bridge/position-report.zip" > "$RUNNER_TEMP/stud-bridge/result.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          x=json.loads(Path(os.environ['RUNNER_TEMP'], 'stud-bridge', 'result.json').read_text())
          assert x['engineering_acceptance']=='NOT_ADMITTED'
          assert x['ratio_is_design_check'] is False
          assert x['tensile_force_direction_at_link']=='NOT_ESTABLISHED'
          assert x['physical_link_stiffness']=='NOT_ESTABLISHED'
          assert x['realistic_design_load_case']=='NOT_ESTABLISHED'
          assert abs(x['research_only_peak_synthetic_axis_force_n']-1.784927)<1e-6
          print('SYNTHETIC_STRENGTH_DEMAND_BRIDGE_RESEARCH_ONLY: PASS')
          PY
      - name: Preserve bounded synthetic-only summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3d20r-synthetic-strength-demand-not-design
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/stud-bridge/result.json
