name: CalculiX 2.21 isolated MPC instrumentation research

on:
  pull_request:
    paths:
      - 'tests/fea_benchmark/solver_instrumentation/**'
      - '.github/workflows/calculix-mpc-instrumentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mpc_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Python diagnostic guards
        run: python -m unittest discover -s tests/fea_benchmark/solver_instrumentation -p 'test_*.py' -v
      - name: Official build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran make gcc libspooles-dev libarpack2-dev liblapack-dev calculix-ccx
      - name: SHA-pinned version 2.21 original archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ccx-source"
          curl --fail --location --retry 2 --max-time 120 'https://archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21.orig.tar.bz2' -o "$RUNNER_TEMP/ccx-source/source.tar.bz2"
          echo "51d229aee320cf685216d360f7c04f9a57af0148fbe840483a964c86c315da82  $RUNNER_TEMP/ccx-source/source.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/ccx-source/source.tar.bz2" -C "$RUNNER_TEMP/ccx-source"
          test "$(sha256sum "$RUNNER_TEMP/ccx-source/CalculiX/ccx_2.21/src/resultsforc.c" | cut -d' ' -f1)" = 'd1de9498ac715a7f08da0b7beba3c92c7c2f1030c85c37122d2708f2f480cad0'
      - name: Compile unmodified and instrumented solver
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ccx-source/CalculiX/ccx_2.21/src"
          cd "$src"
          make -j2 ccx_2.21 CFLAGS='-Wall -O2 -I/usr/include/spooles -DARCH="Linux" -DSPOOLES -DARPACK -DMATRIXSTORAGE -DUSE_MT=1' FFLAGS='-O2 -fallow-argument-mismatch' LIBS='-lspooles -lpthread -larpack -llapack -lblas -lm -lc'
          cp ccx_2.21 "$RUNNER_TEMP/ccx-pristine"
          python "$GITHUB_WORKSPACE/tests/fea_benchmark/solver_instrumentation/ccx_mpc_probe.py" instrument "$src/resultsforc.c"
          rm resultsforc.o ccx_2.21.a ccx_2.21
          make -j2 ccx_2.21 CFLAGS='-Wall -O2 -I/usr/include/spooles -DARCH="Linux" -DSPOOLES -DARPACK -DMATRIXSTORAGE -DUSE_MT=1' FFLAGS='-O2 -fallow-argument-mismatch' LIBS='-lspooles -lpthread -larpack -llapack -lblas -lm -lc'
          cp ccx_2.21 "$RUNNER_TEMP/ccx-instrumented"
          python "$GITHUB_WORKSPACE/tests/fea_benchmark/solver_instrumentation/ccx_mpc_terms.py" instrument "$src/resultsforc.c"
          rm resultsforc.o ccx_2.21.a ccx_2.21
          make -j2 ccx_2.21 CFLAGS='-Wall -O2 -I/usr/include/spooles -DARCH="Linux" -DSPOOLES -DARPACK -DMATRIXSTORAGE -DUSE_MT=1' FFLAGS='-O2 -fallow-argument-mismatch' LIBS='-lspooles -lpthread -larpack -llapack -lblas -lm -lc'
          cp ccx_2.21 "$RUNNER_TEMP/ccx-terms"
          sha256sum "$RUNNER_TEMP/ccx-pristine" "$RUNNER_TEMP/ccx-instrumented"
      - name: Re-run identical synthetic benchmark decks
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ccx-compare"
          mkdir -p "$root"
          for material in aluminum; do
            for n in 4 8; do
              base="$root/${material}_${n}_pristine"
              mod="$root/${material}_${n}_instrumented"
              mkdir -p "$base" "$mod"
              python tests/fea_benchmark/envelope_panels/generate.py --material "$material" --n "$n" --load large --output "$base"
              cp "$base/panel.inp" "$mod/panel.inp"
              (cd "$base" && timeout 120s "$RUNNER_TEMP/ccx-pristine" -i panel)
              (cd "$mod" && CCX_MPC_AUDIT_FILE="$mod/trace.csv" timeout 120s "$RUNNER_TEMP/ccx-instrumented" -i panel)
              python tests/fea_benchmark/solver_instrumentation/ccx_mpc_probe.py compare "$base" "$mod" "$mod/trace.csv"
              terms="$root/${material}_${n}_terms"
              mkdir -p "$terms"
              cp "$base/panel.inp" "$terms/panel.inp"
              (cd "$terms" && CCX_MPC_AUDIT_FILE="$terms/trace.csv" CCX_MPC_TERMS_FILE="$terms/terms.csv" timeout 120s "$RUNNER_TEMP/ccx-terms" -i panel)
              python tests/fea_benchmark/solver_instrumentation/ccx_mpc_probe.py compare "$base" "$terms" "$terms/trace.csv"
              python tests/fea_benchmark/solver_instrumentation/ccx_mpc_terms.py check "$terms/trace.csv" "$terms/terms.csv" "$terms/panel.frd"
            done
          done
