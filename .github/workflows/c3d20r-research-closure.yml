name: C3D20R isolated research closure (NOT DESIGN)
on:
  pull_request:
    paths:
      - .github/workflows/c3d20r-research-closure.yml
      - tests/fea_benchmark/envelope_panels/stud_engineering_intake_report.py
      - tests/fea_benchmark/envelope_panels/stud_hot4_tensile_signed_report.py
      - tests/fea_benchmark/envelope_panels/stud_tensile_strength_screen.py
      - tests/fea_benchmark/envelope_panels/stud_connection_evidence_gate.py
      - tests/fea_benchmark/envelope_panels/test_stud_engineering_intake_report.py
      - tests/fea_benchmark/envelope_panels/test_stud_hot4_tensile_signed_report.py
      - tests/fea_benchmark/envelope_panels/test_stud_tensile_strength_screen.py
      - tests/fea_benchmark/envelope_panels/test_stud_connection_evidence_gate.py
permissions:
  contents: read
  actions: read
jobs:
  restricted-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic only scope and failure-path tests
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p 'test_stud_engineering_intake_report.py' -v
          python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p 'test_stud_hot4_tensile_signed_report.py' -v
          python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p 'test_stud_tensile_strength_screen.py' -v
          python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p 'test_stud_connection_evidence_gate.py' -v
      - name: Fetch and verify pinned raw synthetic solver artifact (expires 2026-11-05)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closure"
          gh api /repos/masini1491/building-envelope-engineering-kb/actions/artifacts/12401885093/zip > "$RUNNER_TEMP/closure/solver.zip"
          echo 'd35d73f6b9f0d5f94f45e53b1c81c607d9839c77c25ea54ba654e033993933a7  '"$RUNNER_TEMP/closure/solver.zip" | sha256sum --check
      - name: Replay exact synthetic solver evidence; reject engineering admission
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tests/fea_benchmark/envelope_panels')
          from stud_engineering_intake_report import fixture
          from test_stud_hot4_tensile_signed_report import strength
          p = Path(os.environ['RUNNER_TEMP']) / 'closure'
          (p / 'request.json').write_text(json.dumps(fixture(mesh=24,case='soft',direction='positive')))
          (p / 'fictional-strength.json').write_text(json.dumps(strength()))
          PY
          python -B tests/fea_benchmark/envelope_panels/stud_engineering_intake_report.py "$RUNNER_TEMP/closure/request.json" --pinned-evidence-zip "$RUNNER_TEMP/closure/solver.zip" > "$RUNNER_TEMP/closure/intake.json"
          python -B tests/fea_benchmark/envelope_panels/stud_hot4_tensile_signed_report.py "$RUNNER_TEMP/closure/fictional-strength.json" "$RUNNER_TEMP/closure/request.json" --pinned-evidence-zip "$RUNNER_TEMP/closure/solver.zip" > "$RUNNER_TEMP/closure/hot4.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'closure'
          i = json.loads((p / 'intake.json').read_text())
          h = json.loads((p / 'hot4.json').read_text())
          assert i['calculation_status'] == 'COMPUTED'
          assert i['engineering_acceptance'] == 'NOT_ADMITTED'
          assert i['solver_evidence_replayed'] is True
          assert h['calculation_status'] == 'COMPUTED_RESEARCH_ONLY'
          assert h['engineering_acceptance'] == 'NOT_ADMITTED'
          assert h['ratio_is_design_check'] is False
          assert h['solver_evidence_replayed'] is True
          assert h['physical_stud_stiffness'] == 'NOT_ESTABLISHED'
          assert h['real_stud_tension_compression_mapping'] == 'NOT_ESTABLISHED'
          print('C3D20R_RESEARCH_ONLY_EXACT_EVIDENCE: PASS')
          PY
