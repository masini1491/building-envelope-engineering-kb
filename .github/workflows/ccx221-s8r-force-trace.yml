name: CalculiX 2.21 隔離反力診斷對照

on:
  pull_request:
    paths:
      - .github/workflows/ccx221-s8r-force-trace.yml
      - tests/fea_benchmark/envelope_panels/ccx221_s8r_force_instrument.py

permissions:
  contents: read
  actions: read

jobs:
  isolated_ab:
    if: github.event.pull_request.number == 131
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: 安裝固定版本建置相依套件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gfortran libspooles-dev libarpack2-dev liblapack-dev
          gfortran --version | head -n 1
      - name: 取得精確來源與既有同次求解輸入
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ccx-ab" "$RUNNER_TEMP/ccx-ab/ref"
          cd "$RUNNER_TEMP/ccx-ab"
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            -o calculix-ccx_2.21.orig.tar.bz2 \
            https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21.orig.tar.bz2
          echo '51d229aee320cf685216d360f7c04f9a57af0148fbe840483a964c86c315da82  calculix-ccx_2.21.orig.tar.bz2' | sha256sum --check
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            -o calculix-ccx_2.21-1.debian.tar.xz \
            https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21-1.debian.tar.xz
          echo '6c2a934b66491c9e916cbf6328167d417f7e985b380e200facf92c3e953d255f  calculix-ccx_2.21-1.debian.tar.xz' | sha256sum --check
          gh run download 39054940762 --repo masini1491/building-envelope-engineering-kb \
            --name calculix-nlgeom-probe --dir "$RUNNER_TEMP/ccx-ab/ref"
          test -f "$RUNNER_TEMP/ccx-ab/ref/envelope_panels/u_s8r_rf_projection_n8_toward/panel.inp"
          echo 'e0360eed38d6708075200c499a870e38e79f120eaa88ff7427c497e7f0cef2cf  '"$RUNNER_TEMP/ccx-ab/ref/envelope_panels/u_s8r_rf_projection_n8_toward/panel.inp" | sha256sum --check
      - name: 構建未修改的 Debian 2.21-1 求解器
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ccx-ab"
          tar -xjf calculix-ccx_2.21.orig.tar.bz2
          cd CalculiX
          tar -xJf ../calculix-ccx_2.21-1.debian.tar.xz
          while IFS= read -r patchname; do
            test -z "$patchname" && continue
            patch --batch --fuzz=0 -p1 < "debian/patches/$patchname" >/dev/null
          done < debian/patches/series
          src="$PWD/ccx_2.21/src"
          make -s -j2 -C "$src" \
            CFLAGS='-O2 -Wall -I/usr/include/spooles -DARCH=\"Linux\" -DSPOOLES -DARPACK -DMATRIXSTORAGE -DUSE_MT=1' \
            FFLAGS='-O2 -fallow-argument-mismatch' > "$RUNNER_TEMP/ccx-ab/pristine-build.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/ccx-ab/pristine-build.log"; exit 1;
            }
          test -x "$src/ccx_2.21"
          cp "$src/ccx_2.21" "$RUNNER_TEMP/ccx-ab/pristine-ccx"
          sha256sum "$RUNNER_TEMP/ccx-ab/pristine-ccx"
      - name: 編譯插樁版並執行同輸入 A/B
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/ccx-ab"
          src="$scratch/CalculiX/ccx_2.21/src"
          cp "$src/results.c" "$scratch/pristine-results.c"
          cp "$src/resultsmech.f" "$scratch/pristine-resultsmech.f"
          python tests/fea_benchmark/envelope_panels/ccx221_s8r_force_instrument.py "$scratch/CalculiX/ccx_2.21"
          diff -q "$scratch/pristine-results.c" "$src/results.c" >/dev/null && { echo 'results.c was not patched'; exit 1; } || true
          diff -q "$scratch/pristine-resultsmech.f" "$src/resultsmech.f" >/dev/null && { echo 'resultsmech.f was not patched'; exit 1; } || true
          make -s -j2 -C "$src" \
            CFLAGS='-O2 -Wall -I/usr/include/spooles -DARCH=\"Linux\" -DSPOOLES -DARPACK -DMATRIXSTORAGE -DUSE_MT=1' \
            FFLAGS='-O2 -fallow-argument-mismatch' > "$scratch/instrumented-build.log" 2>&1 || {
              tail -n 120 "$scratch/instrumented-build.log"; exit 1;
            }
          test -x "$src/ccx_2.21"
          cp "$src/ccx_2.21" "$scratch/instrumented-ccx"
          for side in pristine instrumented; do
            mkdir -p "$scratch/$side"
            cp "$scratch/ref/envelope_panels/u_s8r_rf_projection_n8_toward/panel.inp" "$scratch/$side/panel.inp"
            (
              cd "$scratch/$side"
              export OMP_NUM_THREADS=1 CCX_NPROC_EQUATION=1 CCX_NPROC_RESULTS=1 CCX_NPROC_STIFFNESS=1
              if [ "$side" = instrumented ]; then export KB_CCX_LEDGER=1; fi
              timeout 120s "$scratch/$side-ccx" -i panel > solver.log 2>&1
            )
            test -s "$scratch/$side/panel.dat"
            test -s "$scratch/$side/panel.sta"
            sha256sum "$scratch/$side/panel.inp" "$scratch/$side/panel.dat" "$scratch/$side/panel.sta"
          done
          cmp "$scratch/pristine/panel.inp" "$scratch/instrumented/panel.inp"
          cmp "$scratch/pristine/panel.dat" "$scratch/instrumented/panel.dat"
          cmp "$scratch/pristine/panel.sta" "$scratch/instrumented/panel.sta"
          test -s "$scratch/instrumented/kb_force_ledger.tsv"
          grep -q 'KB_EVENT P' "$scratch/instrumented/kb_force_ledger.tsv"
          grep -q 'KB_EVENT Q' "$scratch/instrumented/kb_force_ledger.tsv"
          test -s "$scratch/instrumented/kb_contact_ledger.tsv"
          grep -q 'KB_SPR' "$scratch/instrumented/kb_contact_ledger.tsv"
          test "$(stat -c %s "$scratch/instrumented/kb_force_ledger.tsv")" -lt 50000000
          echo 'KB_AB_OUTPUT_EQUIVALENT_PRISTINE_INSTRUMENTED_AND_TRACE_PRESENT'
      - name: 保留隔離診斷證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccx221-s8r-n8-ab-diagnostic
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ccx-ab/*.log
            ${{ runner.temp }}/ccx-ab/pristine/panel.inp
            ${{ runner.temp }}/ccx-ab/pristine/panel.dat
            ${{ runner.temp }}/ccx-ab/pristine/panel.sta
            ${{ runner.temp }}/ccx-ab/pristine/solver.log
            ${{ runner.temp }}/ccx-ab/instrumented/panel.inp
            ${{ runner.temp }}/ccx-ab/instrumented/panel.dat
            ${{ runner.temp }}/ccx-ab/instrumented/panel.sta
            ${{ runner.temp }}/ccx-ab/instrumented/solver.log
            ${{ runner.temp }}/ccx-ab/instrumented/kb_force_ledger.tsv
            ${{ runner.temp }}/ccx-ab/instrumented/kb_contact_ledger.tsv
