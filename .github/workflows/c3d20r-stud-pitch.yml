name: C3D20R synthetic stud station count and pitch pilot (NOT DESIGN)
on:
  pull_request:
    paths:
      - .github/workflows/c3d20r-stud-pitch.yml
      - tests/fea_benchmark/envelope_panels/stud_pitch_trial.py
      - tests/fea_benchmark/envelope_panels/test_stud_pitch_trial.py
permissions:
  contents: read
jobs:
  pitch:
    if: github.event.pull_request.number == 135
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fixed endpoint pitch and geometry contracts
        run: python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p test_stud_pitch_trial.py -v
      - name: Get pinned CCX 2.21 and build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c3d20r-pitch"
          cd "$RUNNER_TEMP/c3d20r-pitch"
          curl --fail --location --silent --show-error --retry 2 --max-time 120 -o calculix-ccx_2.21.orig.tar.bz2 https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21.orig.tar.bz2
          curl --fail --location --silent --show-error --retry 2 --max-time 120 -o calculix-ccx_2.21-1.debian.tar.xz https://us.archive.ubuntu.com/ubuntu/pool/universe/c/calculix-ccx/calculix-ccx_2.21-1.debian.tar.xz
          echo '51d229aee320cf685216d360f7c04f9a57af0148fbe840483a964c86c315da82  calculix-ccx_2.21.orig.tar.bz2' | sha256sum --check
          echo '6c2a934b66491c9e916cbf6328167d417f7e985b380e200facf92c3e953d255f  calculix-ccx_2.21-1.debian.tar.xz' | sha256sum --check
          tar -xjf calculix-ccx_2.21.orig.tar.bz2
          cd CalculiX
          tar -xJf ../calculix-ccx_2.21-1.debian.tar.xz
          while IFS= read -r patchname; do
            test -z "$patchname" && continue
            patch --batch --fuzz=0 -p1 < "debian/patches/$patchname" > /dev/null
          done < debian/patches/series
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gfortran libspooles-dev libarpack2-dev liblapack-dev
          make -s -j2 -C ccx_2.21/src CFLAGS='-O2 -Wall -I/usr/include/spooles -DARCH=Linux -DSPOOLES -DARPACK -DMATRIXSTORAGE -DUSE_MT=1' FFLAGS='-O2 -fallow-argument-mismatch' > "$RUNNER_TEMP/c3d20r-pitch/ccx-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/c3d20r-pitch/ccx-build.log"; exit 1; }
          cp ccx_2.21/src/ccx_2.21 "$RUNNER_TEMP/c3d20r-pitch/ccx"
      - name: Solve two meshes two counts two synthetic stiffnesses
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c3d20r-pitch"
          export OMP_NUM_THREADS=1 CCX_NPROC_EQUATION=1 CCX_NPROC_RESULTS=1 CCX_NPROC_STIFFNESS=1
          for n in 8 16; do
            for profile in three_450 five_225; do
              for k in soft stiff; do
                folder="$root/pitch_${n}_${profile}_${k}"
                python -B tests/fea_benchmark/envelope_panels/stud_pitch_trial.py "$n" "$profile" "$k" "$folder"
                (cd "$folder"; timeout 220s "$root/ccx" -i panel > solver.log 2>&1) || { tail -n 85 "$folder/solver.log"; exit 1; }
                test -s "$folder/panel.dat"
                test -s "$folder/panel.sta"
                test -s "$folder/panel.frd"
                echo "STUD_PITCH_SOLVER_OUTPUT n=$n profile=$profile k=$k"
              done
            done
          done
      - name: Preserve eight solver artifacts for independent reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3d20r-stud-pitch-3-and-5-station-raw-not-design
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/c3d20r-pitch/pitch_*/panel.inp
            ${{ runner.temp }}/c3d20r-pitch/pitch_*/panel.dat
            ${{ runner.temp }}/c3d20r-pitch/pitch_*/panel.sta
            ${{ runner.temp }}/c3d20r-pitch/pitch_*/panel.frd
            ${{ runner.temp }}/c3d20r-pitch/pitch_*/solver.log
