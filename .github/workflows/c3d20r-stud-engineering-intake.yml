name: C3D20R Hot3 bounded engineering intake and Traditional Chinese report (NOT DESIGN)
on:
  pull_request:
    paths:
      - .github/workflows/c3d20r-stud-engineering-intake.yml
      - tests/fea_benchmark/envelope_panels/stud_engineering_intake_report.py
      - tests/fea_benchmark/envelope_panels/test_stud_engineering_intake_report.py
permissions:
  contents: read
  actions: read
jobs:
  intake:
    if: github.event.pull_request.number == 135
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Fixed fixture, refusal paths, and command line tests
        run: python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p test_stud_engineering_intake_report.py -v
      - name: Reuse pinned Hot 2 solver evidence rather than solving again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c3d20r-hot3"
          gh api /repos/masini1491/building-envelope-engineering-kb/actions/artifacts/12401885093/zip > "$RUNNER_TEMP/c3d20r-hot3/evidence.zip"
          echo 'd35d73f6b9f0d5f94f45e53b1c81c607d9839c77c25ea54ba654e033993933a7  '"$RUNNER_TEMP/c3d20r-hot3/evidence.zip" | sha256sum --check
      - name: Exact solver replay and bounded Chinese synthetic report
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tests/fea_benchmark/envelope_panels')
          from stud_engineering_intake_report import fixture
          folder=Path(os.environ['RUNNER_TEMP'])/'c3d20r-hot3'
          (folder/'fixture.json').write_text(json.dumps(fixture(mesh=24,case='soft',direction='positive')))
          PY
          python -B tests/fea_benchmark/envelope_panels/stud_engineering_intake_report.py "$RUNNER_TEMP/c3d20r-hot3/fixture.json" --pinned-evidence-zip "$RUNNER_TEMP/c3d20r-hot3/evidence.zip" > "$RUNNER_TEMP/c3d20r-hot3/report.json"
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'c3d20r-hot3'
          report=json.loads((folder/'report.json').read_text())
          assert report['calculation_status']=='COMPUTED'
          assert report['comparison_status']=='NOT_PROVIDED'
          assert report['engineering_acceptance']=='NOT_ADMITTED'
          assert report['solver_evidence_replayed'] is True
          assert report['selected']=={'mesh':24,'case':'soft','direction':'positive'}
          assert 'NOT_ADMITTED' in report['report_zh_tw']
          assert '| n24 |' in report['report_zh_tw']
          (folder/'comparison-zh-TW.md').write_text(report['report_zh_tw'],encoding='utf8')
          print('HOT3_BOUNDED_SYNTHETIC_EVIDENCE_REPLAY: PASS')
          PY
      - name: Publish synthetic research report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3d20r-hot3-bounded-synthetic-input-zh-TW-not-design
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/c3d20r-hot3/report.json
            ${{ runner.temp }}/c3d20r-hot3/comparison-zh-TW.md
