name: 第二輪 Markdown 繁中介面收斂

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-language:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 執行第二輪繁中介面收斂
        run: python scripts/localize_remaining_headings.py

      - name: 檢查 diff 格式
        run: git diff --check

      - name: Commit second-pass normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No second-pass language changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "完成第二輪 Markdown 繁中介面收斂"
          git push origin HEAD:main
