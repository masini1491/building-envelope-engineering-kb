name: 最終繁中 fallback 清理

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finish-language-fallbacks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 清理最後 fallback heading
        run: python scripts/finish_language_fallbacks.py

      - name: 檢查 diff 格式
        run: git diff --check

      - name: Commit final fallback cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No fallback language changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "完成繁中 fallback 標題清理"
          git push origin HEAD:main
