name: C3D20R fixed-count interior station evidence replay (NOT DESIGN)
on:
  pull_request:
    paths:
      - .github/workflows/c3d20r-stud-position-replay.yml
      - tests/fea_benchmark/envelope_panels/verify_stud_position_evidence.py
      - tests/fea_benchmark/envelope_panels/test_verify_stud_position_evidence.py
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.event.pull_request.number == 135
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Provenance and mutation negative tests
        run: python -B -m unittest discover -s tests/fea_benchmark/envelope_panels -p test_verify_stud_position_evidence.py -v
      - name: Retrieve three original pinned solver artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stud-position-evidence"
          gh api /repos/masini1491/building-envelope-engineering-kb/actions/artifacts/12343350225/zip > "$RUNNER_TEMP/stud-position-evidence/moved.zip"
          gh api /repos/masini1491/building-envelope-engineering-kb/actions/artifacts/12339710329/zip > "$RUNNER_TEMP/stud-position-evidence/four.zip"
          gh api /repos/masini1491/building-envelope-engineering-kb/actions/artifacts/12342130881/zip > "$RUNNER_TEMP/stud-position-evidence/five.zip"
          echo '445414375571a6d74aaf3e90859868b4ad3c6f57b5e1e51d21edb4750e858d02  '"$RUNNER_TEMP/stud-position-evidence/moved.zip" | sha256sum --check
          echo '03cda477016e945c5f76a5b88a0548a08027c62ec777e4d5e7afec4c6b0e7f7a  '"$RUNNER_TEMP/stud-position-evidence/four.zip" | sha256sum --check
          echo 'c249bb93622b66cd25aab87fa503c3b179ebde1ead2e632c47dd2f1ef0149279  '"$RUNNER_TEMP/stud-position-evidence/five.zip" | sha256sum --check
      - name: Verify input provenance, reaction, and controlled location response
        run: |
          set -euo pipefail
          python -B tests/fea_benchmark/envelope_panels/verify_stud_position_evidence.py "$RUNNER_TEMP/stud-position-evidence/moved.zip" "$RUNNER_TEMP/stud-position-evidence/four.zip" "$RUNNER_TEMP/stud-position-evidence/five.zip" > "$RUNNER_TEMP/stud-position-evidence/report.json"
          cat "$RUNNER_TEMP/stud-position-evidence/report.json"
      - name: Preserve auditable research comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3d20r-fixed-count-station-replay-not-design
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/stud-position-evidence/report.json
